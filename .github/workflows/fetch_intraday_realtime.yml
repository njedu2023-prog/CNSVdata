name: Fetch realtime intraday data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fetch_intraday_realtime.yml"
      - "cnsvdata/intraday.py"
      - "scripts/fetch_intraday_1min_1400.py"
      - "scripts/build_intraday_realtime_ready.py"
      - "tests/test_intraday_realtime.py"
  schedule:
    # Beijing 09:50-11:30 and 13:10-15:10, every 20 minutes.
    - cron: "50 1 * * 1-5"
    - cron: "10,30,50 2 * * 1-5"
    - cron: "10,30 3 * * 1-5"
    - cron: "10,30,50 5 * * 1-5"
    - cron: "10,30,50 6 * * 1-5"
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: cnsvdata-intraday-writes-main
  cancel-in-progress: false

jobs:
  fetch-realtime-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fetch current-day 1min bars from Tushare
        run: python scripts/fetch_intraday_1min_1400.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Publish realtime freshness contract
        run: python scripts/build_intraday_realtime_ready.py
      - run: pytest -q tests/test_intraday_realtime.py tests/test_intraday_no_future_leak.py
      - name: Commit realtime intraday update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday/raw metadata/intraday/intraday_realtime_ready.json
          if git diff --cached --quiet; then
            echo "No realtime intraday update"
            exit 0
          fi
          git commit -m "data: refresh realtime intraday bars"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 5
          done
