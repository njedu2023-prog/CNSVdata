name: CNSVdata daily pipeline

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/daily_pipeline.yml"
      - "cnsvdata/**"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
  schedule:
    # Beijing 20:04 primary, then 20:19 / 20:34 / 20:49 / 21:04 fallbacks every day.
    # Multiple entries reduce GitHub schedule-delay and upstream-latency risk.
    # A freshness gate rejects a run until the current completed trading day is present.
    - cron: "4 12 * * *"
    - cron: "19 12 * * *"
    - cron: "34 12 * * *"
    - cron: "49 12 * * *"
    - cron: "4 13 * * *"

permissions:
  contents: write

concurrency:
  group: cnsvdata-daily-pipeline-main
  cancel-in-progress: false

jobs:
  check-needed:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.freshness.outputs.should_run }}
      reason: ${{ steps.freshness.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether close data needs refreshing
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def iso_date(value):
              text = str(value or "")[:10].replace("-", "")
              return f"{text[:4]}-{text[4:6]}-{text[6:8]}" if len(text) == 8 and text.isdigit() else ""

          if os.environ["EVENT_NAME"] != "schedule":
              print("should_run=true")
              print("reason=manual_or_workflow_change")
              raise SystemExit(0)

          latest_path = Path("metadata/daily/daily_latest_trade_date.json")
          next_path = Path("metadata/daily/daily_next_trade_date.json")
          latest_payload = json.loads(latest_path.read_text(encoding="utf-8")) if latest_path.exists() else {}
          next_payload = json.loads(next_path.read_text(encoding="utf-8")) if next_path.exists() else {}
          latest = iso_date(latest_payload.get("latest_trade_date"))
          next_trade = iso_date(next_payload.get("next_trade_date"))
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          today = now.date().isoformat()
          after_close = now.hour * 60 + now.minute >= 16 * 60 + 30
          should_run = not latest or not next_trade or (after_close and today >= next_trade and latest < next_trade)
          print(f"should_run={str(should_run).lower()}")
          print(f"reason={'close_data_due' if should_run else 'already_fresh_or_non_trading_day'}")
          PY

  daily-pipeline:
    needs: check-needed
    if: needs.check-needed.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Fetch trade calendar
        run: python scripts/fetch_trade_calendar.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Fetch daily bars
        run: python scripts/fetch_cnsv_daily.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Fetch moneyflow
        run: python scripts/fetch_moneyflow.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Fetch 1min bars
        run: python scripts/fetch_cnsv_1min.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Build processed daily data
        run: python scripts/build_processed_daily.py
      - name: Build minute bars
        run: python scripts/build_minute_bars.py
      - name: Build corporate actions
        run: python scripts/build_corporate_actions.py
      - name: Build structural breaks
        run: python scripts/build_structural_breaks.py
      - name: Build daily contracts
        run: |
          python scripts/build_daily_manifest.py
          python scripts/build_daily_ready.py
      - name: Build intraday T+1 truth
        run: |
          python scripts/build_t1_truth_vs_1400.py
          python scripts/build_t1_intraday_trainset.py
          python scripts/build_intraday_preview_csv.py
      - name: Build data manifests and previews
        run: |
          python scripts/build_data_manifest.py
          python scripts/build_preview_csv.py
      - name: Run daily acceptance
        run: |
          python scripts/daily_acceptance_check.py
          python scripts/daily_smoke_downstream_read.py
      - name: Run intraday acceptance
        run: |
          python scripts/intraday_acceptance_check.py
          python scripts/intraday_smoke_downstream_read.py
          python scripts/build_intraday_ready_1400.py
      - name: Run full quality and downstream checks
        if: always()
        run: |
          python scripts/detect_data_gaps.py
          python scripts/quality_check.py
          python scripts/build_data_manifest.py
          python scripts/acceptance_check.py
          python scripts/smoke_downstream_read.py
          python scripts/build_downstream_ready.py
          python scripts/build_failure_summary.py
          python scripts/archive_quality_snapshot.py
      - name: Check expected close-data freshness
        id: close_freshness
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          manifest_path = Path("metadata/data_manifest.json")
          if not manifest_path.exists():
              print("::error::metadata/data_manifest.json is missing")
              raise SystemExit(1)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          def iso_date(value):
              text = str(value or "")[:10].replace("-", "")
              return f"{text[:4]}-{text[4:6]}-{text[6:8]}" if len(text) == 8 and text.isdigit() else ""

          latest = iso_date(manifest.get("latest_trade_date"))
          next_trade = iso_date(manifest.get("next_trade_date"))
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          today = now.date().isoformat()
          after_close_availability = now.hour * 60 + now.minute >= 16 * 60 + 30
          if not latest or not next_trade:
              print(f"::error::invalid trade dates: latest={latest!r}, next={next_trade!r}")
              raise SystemExit(1)
          expected_missing = today > next_trade or (today == next_trade and after_close_availability)
          if expected_missing and latest < next_trade:
              print(f"::error::close data is stale: Beijing today={today}, latest={latest}, expected={next_trade}")
              print("A later scheduled fallback will retry after the upstream close data is available.")
              raise SystemExit(1)
          print(f"close data freshness PASS: Beijing today={today}, latest={latest}, next={next_trade}")
          PY
      - name: Commit CNSVdata daily updates
        if: always() && steps.close_freshness.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed data/preview data/daily data/intraday data/quality metadata || true
          if git diff --cached --quiet; then
            echo "No CNSVdata daily updates to commit"
            exit 0
          fi
          git commit -m "data: update CNSVdata daily pipeline outputs"
          for attempt in 1 2 3; do
            # During a rebase, "theirs" is the fresh daily commit being replayed.
            if git pull --rebase -X theirs origin main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Fail if downstream is not ready
        if: always()
        run: |
          python -c "import json, pathlib, sys; p=pathlib.Path('metadata/downstream_ready.json'); payload=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'FAIL','blocking_reason':'missing downstream_ready.json'}; print('downstream_ready:', payload.get('status'), payload.get('blocking_reason', '')); sys.exit(1 if payload.get('status') == 'FAIL' or payload.get('ready') is False else 0)"
