name: Fetch intraday 14:00 data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fetch_intraday_1400.yml"
      - "cnsvdata/intraday.py"
      - "scripts/fetch_intraday_1min_1400.py"
      - "scripts/build_t1_truth_vs_1400.py"
      - "scripts/build_t1_intraday_trainset.py"
      - "tests/test_intraday_trainset.py"
      - "tests/test_t1_truth_vs_1400.py"
  schedule:
    # Retry the immutable 14:00 snapshot every 20 minutes after it becomes available.
    - cron: "5,25,45 6 * * 1-5"
    - cron: "5 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: cnsvdata-intraday-writes-main
  cancel-in-progress: false

jobs:
  fetch-intraday-1400:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      CNSVDATA_INTRADAY_HISTORY_DAYS: "150"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_intraday_1min_1400.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - run: python scripts/build_intraday_bars_1400.py
      - run: python scripts/build_intraday_snapshot_1400.py
      - run: python scripts/check_intraday_quality_1400.py
      - run: python scripts/build_intraday_manifest_1400.py
      - run: python scripts/build_intraday_ready_1400.py
      - run: python scripts/build_intraday_realtime_ready.py
      - name: Refresh T+1 truth and training set
        run: |
          python scripts/build_t1_truth_vs_1400.py
          python scripts/build_t1_intraday_trainset.py
      - run: python scripts/build_intraday_preview_csv.py
      - run: pytest
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday data/quality/intraday metadata/intraday
          if git diff --cached --quiet; then
            echo "No intraday updates to commit"
            exit 0
          fi
          git commit -m "data: update intraday 1400 snapshot"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 5
          done
